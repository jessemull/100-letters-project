name: Pull Request

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Next.js
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js
        run: |
          echo "Deploying to development environment"
          NODE_ENV=test npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.API_URL_DEV }}
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID_DEV }}
          NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID: ${{ secrets.COGNITO_USER_POOL_CLIENT_ID_DEV }}
          COGNITO_USER_POOL_PASSWORD: ${{ secrets.COGNITO_USER_POOL_PASSWORD_DEV }}
          COGNITO_USER_POOL_USERNAME: ${{ secrets.COGNITO_USER_POOL_USERNAME_DEV }}
          NEXT_PUBLIC_GA_TRACKING_ID: ${{ secrets.GA_TRACKING_ID_DEV }}
          NEXT_PUBLIC_CAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_CAPTCHA_SITE_KEY }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${{ secrets.SENTRY_ENVIRONMENT_DEV }}
          NEXT_PUBLIC_STRIPE_URL: ${{ secrets.NEXT_PUBLIC_STRIPE_URL_DEV }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_AUTH_TOKEN_SOURCE_MAPS: ${{ secrets.SENTRY_AUTH_TOKEN_SOURCE_MAPS }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: Copy Sitemap and Robots Files
        run: |
          cp public/sitemap.xml out/
          cp public/robots.txt out/
          cp public/sitemap-0.xml out/

      - name: Archive Build Output
        uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: out
          retention-days: 1

      - name: Archive Static Data
        uses: actions/upload-artifact@v7
        with:
          name: public-json
          path: |
            public/data/bootstrap.json
            public/data/data.*.json
            public/data/search.*.json
          retention-days: 1

        # Sentry does not support source maps for static NextJS builds.
        # The source maps must be uploaded manually.
        # NextJS does not support generating source maps independently.
        # To avoid uploading source maps in production NextJS must be built twice, once for each use case.

      - name: Generate & Upload Sentry Source Maps
        run: |
          echo "Uploading source maps to Sentry.io..."
          NODE_ENV=test npm run source-maps
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.API_URL_DEV }}
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID_DEV }}
          NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID: ${{ secrets.COGNITO_USER_POOL_CLIENT_ID_DEV }}
          COGNITO_USER_POOL_PASSWORD: ${{ secrets.COGNITO_USER_POOL_PASSWORD_DEV }}
          COGNITO_USER_POOL_USERNAME: ${{ secrets.COGNITO_USER_POOL_USERNAME_DEV }}
          NEXT_PUBLIC_GA_TRACKING_ID: ${{ secrets.GA_TRACKING_ID_DEV }}
          NEXT_PUBLIC_CAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_CAPTCHA_SITE_KEY }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${{ secrets.SENTRY_ENVIRONMENT_DEV }}
          NEXT_PUBLIC_STRIPE_URL: ${{ secrets.NEXT_PUBLIC_STRIPE_URL_DEV }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_AUTH_TOKEN_SOURCE_MAPS: ${{ secrets.SENTRY_AUTH_TOKEN_SOURCE_MAPS }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linting
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

  test:
    name: Run Unit Tests
    needs: [build, lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Restore Static Data
        uses: actions/download-artifact@v8
        with:
          name: public-json
          path: public/data

      - name: Run Jest Tests
        run: npm run test

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
          retention-days: 7

  e2e_and_lighthouse_tests:
    name: Run E2E & Lighthouse Tests
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Download Build Output
        uses: actions/download-artifact@v8
        with:
          name: next-build
          path: out

      - name: Start Static Export Server
        run: |
          npx --yes serve out -l 3000 &
          npx wait-on http://localhost:3000

      - name: Run Cypress Tests
        run: |
          npx cypress run --config baseUrl=http://localhost:3000

      - name: Warm Up Static Server
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" http://localhost:3000/
          for path in /index.html /login.html /contact.html /favicon.ico /background.webp; do
            curl -s -o /dev/null "http://localhost:3000${path}" || true
          done

      - name: Run Lighthouse Tests
        run: |
          npx lhci autorun --chrome-flags="--headless --disable-gpu --no-sandbox"
        continue-on-error: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
